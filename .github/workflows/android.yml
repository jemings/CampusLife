name: android

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "packages/api-contracts/**"
      - "services/agent/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "packages/api-contracts/**"
      - "services/agent/**"
      - ".github/workflows/android.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Pick the JDK and Gradle versions from the version catalog
        id: toolchain
        shell: python3 {0}
        run: |
          import os, tomllib
          with open("gradle/libs.versions.toml", "rb") as catalog:
              versions = tomllib.load(catalog)["versions"]
          jdk_home = os.environ.get(f"JAVA_HOME_{versions['jdk']}_X64")
          if not jdk_home:
              raise SystemExit(f"the runner image has no JDK {versions['jdk']}")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"JAVA_HOME={jdk_home}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"gradle={versions['gradle']}\n")
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ steps.toolchain.outputs.gradle }}
          cache-provider: basic
      - run: gradle --continue --warning-mode all --no-build-cache test lint assembleDebug
