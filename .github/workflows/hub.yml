name: hub

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: uv run pytest

  changes:
    runs-on: ubuntu-latest
    outputs:
      hub: ${{ steps.filter.outputs.hub }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Did the Hub, the contract or this workflow change?
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no comparable base commit; running the Windows job"
            echo "hub=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^(services/agent/|packages/api-contracts/|\.github/workflows/hub\.yml$)'; then
            echo "hub=true" >> "$GITHUB_OUTPUT"
          else
            echo "hub=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: changes
    if: needs.changes.outputs.hub == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: uv run pytest
