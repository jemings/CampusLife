[versions]
# CI runs this Gradle through setup-gradle; there is no wrapper.
gradle = "9.7.1"
jdk = "21"
jvmTarget = "17"
# :wire, which the app runs, compiles against the Java 8 class library. Android has its core
# (streams, java.time) by API 26, below minSdk; later JDK members come as late as API 34
# (Stream.toList), and lint's NewApi does not read a JVM module.
wireJdkRelease = "1.8"

minSdk = "31"
compileSdk = "36"
targetSdk = "36"

# kotlinlang's table for Kotlin 2.4.20–2.4.21: AGP 8.5.2–9.3.1, Gradle 7.6.3–9.7.0.
# AGP 9.3.3 and Gradle 9.7.1 are later patches of those lines, built in CI.
agp = "9.3.3"
kotlin = "2.4.21"
ksp = "2.3.14"
kotlinxSerialization = "1.13.0"

# Compose 1.12 (BOM 2026.08.00) and later need compileSdk 37.
composeBom = "2026.06.01"

activityCompose = "1.13.0"
room = "2.8.5"
work = "2.12.0"

junit = "4.13.2"
robolectric = "4.18.1"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
