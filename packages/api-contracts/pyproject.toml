[project]
name = "campuslife-contracts"
version = "0.1.0"
description = "CampusLife wire contract: JSON Schemas, golden fixtures and the reference validator"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26,<5",
    "referencing>=0.36",
    "regress>=2025.10",
    "tzdata>=2025.2",
]

[project.scripts]
campuslife-contracts = "campuslife_contracts.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "check-jsonschema>=0.39",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campuslife_contracts"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "campuslife_contracts/contract/schemas"
"fixtures" = "campuslife_contracts/contract/fixtures"

[tool.hatch.build.targets.sdist]
include = ["src", "schemas", "fixtures", "tests", "HARNESS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
