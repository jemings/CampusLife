[project]
name = "campuslife-hub"
version = "0.1.0"
description = "CampusLife Windows Hub: data root, SQLite, change feed, Blob store and the Mutation applier"
requires-python = ">=3.12"
dependencies = [
    "campuslife-contracts",
    "fastapi>=0.165.0",
    "python-multipart>=0.0.34",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
campuslife-hub = "campuslife_hub.cli:main"

[project.gui-scripts]
campuslife-hubw = "campuslife_hub.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.29.0",
    "pytest>=8.4",
    "pyyaml>=6",
]

[tool.uv.sources]
campuslife-contracts = { path = "../../packages/api-contracts", editable = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campuslife_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
